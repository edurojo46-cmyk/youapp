<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Anti-Cache Headers para Forzar Actualizaciones Inmediatas en Móviles -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA & Fullscreen sin barra de URL en móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimum-scale=1.0, maximum-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YouApp TV" />
    <meta name="theme-color" content="#05070c" />
    <meta name="msapplication-navbutton-color" content="#05070c" />
    <meta name="msapplication-starturl" content="/#/live" />
    <meta name="application-name" content="YouApp TV" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Splash / Icon -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>YouApp TV — Televisión en Vivo 24/7</title>

    <style>
      /* Ocultar barras del sistema en modo standalone/fullscreen */
      html, body {
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #05070c;
      }
      /* Safe area para notch de iPhone */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
