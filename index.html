<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Anti-Cache Headers para Forzar Actualizaciones Inmediatas -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) { r.unregister(); }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var n of names) { caches.delete(n); }
          });
        }
      })();
    </script>
    <script>
      window.process = window.process || { env: { NODE_ENV: 'development' } };
    </script>

    <!-- PWA & Fullscreen sin barra de URL en móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimum-scale=1.0, maximum-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YouApp TV" />
    <meta name="theme-color" content="#05070c" />
    <meta name="msapplication-navbutton-color" content="#05070c" />
    <meta name="msapplication-starturl" content="/#/live" />
    <meta name="application-name" content="YouApp TV" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Splash / Icon -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>YouApp TV — Televisión en Vivo 24/7</title>

    <style>
      /* Ocultar barras del sistema en modo standalone/fullscreen */
      html, body {
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #05070c;
      }
      /* Safe area para notch de iPhone */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="background:#07090e; color:#e2e8f0; padding:2rem; font-family:sans-serif; text-align:center;">
        <h2>Atlas Broadcast &amp; YouApp TV</h2>
        <p>Next-generation live streaming, broadcast automation, and social video distribution platform.</p>
        <p style="margin-top:1rem;">
          <a href="/terms.html" style="color:#38bdf8; margin: 0 10px;">Terms of Service</a> |
          <a href="/privacy.html" style="color:#38bdf8; margin: 0 10px;">Privacy Policy</a> |
          <a href="/atlas.html" style="color:#38bdf8; margin: 0 10px;">Atlas Broadcast</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
