name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_SUPABASE_URL: https://jtnurafmngaxdwlzpvxv.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_IWSDC0aWUR8cvOPrwYSaqg_JU8aASm8
          VITE_YOUTUBE_API_KEY: AIzaSyBMhLs1XEBfInBFB7vQ3DjMZfP-2OCM1xw
          VITE_YOUTUBE_API_KEYS: AIzaSyBMhLs1XEBfInBFB7vQ3DjMZfP-2OCM1xw
          VITE_ATLAS_PUBLIC_URL: https://youapptv.com
          ATLAS_PUBLIC_URL: https://youapptv.com
        run: |
          npm run build 2>&1 | tee build.log || true
          echo "### Build Log Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ ! -d "dist" ]; then
            echo "DIST NOT CREATED!"
            exit 1
          fi
          cp dist/index.html dist/404.html
          mkdir -p dist/recomendados
          cp dist/index.html dist/recomendados/index.html
          mkdir -p dist/productos-recomendados
          cp dist/index.html dist/productos-recomendados/index.html
          [ -f public/CNAME ] && cp public/CNAME dist/CNAME || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
