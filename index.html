    <!-- Anti-Cache Headers para Forzar Actualizaciones Inmediatas -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <script>
      (function() {
        var VERSION_KEY = 'youapp_live_version_v1';
        var RELOAD_GUARD_KEY = 'youapp_auto_reload_ts';
        function purgeCaches() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var r of regs) { r.unregister(); }
              }).catch(function() {});
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var n of names) { caches.delete(n); }
              }).catch(function() {});
            }
          } catch (e) {}
        }
        purgeCaches();

        function checkLiveVersion() {
          if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;
          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function(res) { return res.ok ? res.json() : null; })
            .then(function(data) {
              if (!data || !data.version) return;
              var prev = null;
              try { prev = localStorage.getItem(VERSION_KEY); } catch (e) {}
              if (!prev) {
                try { localStorage.setItem(VERSION_KEY, data.version); } catch (e) {}
                return;
              }
              if (prev !== data.version) {
                var lastReload = 0;
                try { lastReload = Number(sessionStorage.getItem(RELOAD_GUARD_KEY) || '0'); } catch (e) {}
                try { localStorage.setItem(VERSION_KEY, data.version); } catch (e) {}
                if (Date.now() - lastReload > 15000) {
                  try { sessionStorage.setItem(RELOAD_GUARD_KEY, String(Date.now())); } catch (e) {}
                  purgeCaches();
                  window.location.reload();
                }
              }
            })
            .catch(function() {});
        }

        checkLiveVersion();
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') checkLiveVersion();
        });
        window.setInterval(checkLiveVersion, 180000);
      })();
    </script>
    <script>
      window.process = window.process || { env: { NODE_ENV: 'development' } };
      (function() {
        if (typeof navigator !== 'undefined' && window.YouAppAndroidPiP && typeof window.YouAppAndroidPiP.share === 'function') {
          var nativeShare = function(data) {
            window.YouAppAndroidPiP.share((data && data.title) || '', (data && data.text) || '', (data && data.url) || '');
            return Promise.resolve();
          };
          try {
            Object.defineProperty(navigator, 'share', { value: nativeShare, configurable: true, writable: true });
          } catch (e) {
            try { navigator.share = nativeShare; } catch (_) {}
          }
        }
      })();
    </script>
