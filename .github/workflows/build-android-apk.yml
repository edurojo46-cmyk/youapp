name: Build Android APK (YOUAPP TV PiP)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'capacitor.config.json'
      - 'scripts/android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare minimal webDir + Install Capacitor Android
        run: |
          mkdir -p dist
          echo '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://youapptv.com"></head><body style="background:#05070c"></body></html>' > dist/index.html
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          node scripts/android/patch-android-pip.mjs
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload YOUAPP-TV-Android-PiP.apk
        uses: actions/upload-artifact@v4
        with:
          name: YOUAPP-TV-Android-PiP
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish direct APK download (GitHub Release)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YOUAPP-TV-Android-PiP.apk
          gh release delete android-pip-latest --yes 2>/dev/null || true
          gh release create android-pip-latest YOUAPP-TV-Android-PiP.apk \
            --title "YOUAPP TV Android (PiP nativo)" \
            --notes "Descarga directa del APK Android con Picture-in-Picture nativo y Share Target."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
